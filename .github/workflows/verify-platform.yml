name: Verify platform contracts

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: platform-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      QUANT_WRITE_API_KEY: ci-quant-write-key
      N8N_ENCRYPTION_KEY: ci-n8n-encryption-key
      QUANT_BACKGROUND_TASKS_ENABLED: "false"
      # compose.yaml requires these for the feishu-adapter service; CI never
      # talks to Feishu, so placeholders only let compose interpolate.
      FEISHU_APP_ID: ci-feishu-app-id
      FEISHU_APP_SECRET: ci-feishu-app-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            feishu-relay/dashboard/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install integration test dependencies
        run: python3 -m pip install --quiet pytest pyyaml

      - name: Verify architecture contracts
        run: |
          python3 scripts/verify_architecture.py
          python3 scripts/generate_scripts_catalog.py --check

      - name: Verify component boundaries
        run: |
          python3 scripts/verify_component_boundaries.py --check
          python3 scripts/verify_component_runtimes.py --check
          python3 scripts/verify_runtime_hosts.py --check

      # Every guard under scripts/ (boundaries, hot-update paths, release units,
      # the session guard and its release lock, activation) - until 2026-10-08 CI
      # ran three of these files by name and none of the rest.
      - name: Test integration guards and release scripts
        run: python3 -m pytest scripts -q

      - name: Verify release scripts
        run: |
          node scripts/release-sync-status.test.mjs
          node scripts/shared-peer/deploy-code-only.test.mjs
          node feishu-relay/scripts/edge/deploy-feishu-relay-edge-release.test.mjs
          node feishu-relay/scripts/edge/hotfix-feishu-relay-edge.test.mjs
          node scripts/verify-quant-gateway-caller-contract.mjs

      - name: Install and verify dashboard
        run: |
          npm ci --prefix frontend
          npm run typecheck --prefix frontend
          npm test --prefix frontend
          npm run build --prefix frontend

      - name: Install and verify Feishu dashboard
        run: |
          npm ci --prefix feishu-relay/dashboard
          npm run typecheck --prefix feishu-relay/dashboard
          npm test --prefix feishu-relay/dashboard
          npm run build --prefix feishu-relay/dashboard

      - name: Build and test research service
        run: |
          docker compose up -d --wait --wait-timeout 120 postgres
          docker compose build quant-research
          # The PostgreSQL-backed tests need the real schema: the quant bootstrap
          # stamps the baseline and upgrades to head on a bare database. It no
          # longer needs the Feishu relay's ingestion ledger first; if it ever
          # does again, this step fails instead of quietly re-coupling them.
          docker compose run --rm --no-deps quant-research python database_bootstrap.py
          docker compose run --rm --no-deps quant-research python -m unittest discover -s tests -q

      - name: Verify mounted API contract and generated types
        run: |
          docker compose up -d --wait --wait-timeout 120 postgres quant-research
          node scripts/verify-api-contract.mjs
          npm run api:check --prefix frontend

      - name: Test Feishu adapter sources
        run: |
          npm ci --prefix feishu-relay/adapter --no-audit --no-fund
          cd feishu-relay/adapter && node --test *.test.mjs

      - name: Build standalone component images
        run: |
          docker build --tag n8n-quant-standalone:test --file quant-service/Dockerfile.standalone quant-service
          docker build --tag n8n-feishu-standalone:test --file feishu-relay/adapter/Dockerfile.standalone feishu-relay
          docker build --tag n8n-feishu-bridge-standalone:test --file feishu-relay/bridge/Dockerfile.runtime feishu-relay
          docker build --tag n8n-xhs-standalone:test --file xhs-intel/Dockerfile.runtime xhs-intel

      - name: Build and test Feishu adapter image
        run: |
          docker build --tag n8n-feishu-adapter:test --file feishu-relay/adapter/Dockerfile .
          # The same tests against the modules the image actually ships.  The
          # Dockerfile manifest check reads the build recipes, which are not in
          # the image; it ran against the sources in the step above.
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/feishu-relay/adapter:/tests:ro" \
            n8n-feishu-adapter:test \
            sh -lc 'cp /tests/*.test.mjs /app/ && rm /app/dockerfile-manifest.test.mjs && node --test *.test.mjs'

      - name: Verify whitespace
        run: git diff --check

      - name: Clean CI containers
        if: always()
        run: docker compose down --volumes --remove-orphans
