services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.33.7
    container_name: feishu-relay-edge-n8n
    network_mode: host
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: 127.0.0.1
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${RELAY_PGDATABASE}
      DB_POSTGRESDB_USER: ${RELAY_PGUSER}
      DB_POSTGRESDB_PASSWORD: ${RELAY_PGPASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: 127.0.0.1
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_LISTEN_ADDRESS: 127.0.0.1
      N8N_EDITOR_BASE_URL: http://127.0.0.1:5678
      N8N_WEBHOOK_URL: http://127.0.0.1:5678/
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "72"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      # Keep the edge main process and the JavaScript task runner as separate
      # processes, with a dedicated shared token instead of the encryption key.
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_TASK_TIMEOUT: "300"
      N8N_RUNNERS_TASK_REQUEST_TIMEOUT: "300"
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?Set N8N_RUNNERS_AUTH_TOKEN in secrets.env}
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 127.0.0.1
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      QUANT_SERVICE_URL: ${QUANT_SERVICE_URL:-http://127.0.0.1:15682}
      QUANT_WRITE_API_KEY: ${QUANT_WRITE_API_KEY}
      REMOTE_ANALYST_ARCHIVE_BASE_URL: ${REMOTE_ANALYST_ARCHIVE_BASE_URL:-}
      XHS_COLLECTOR_TOKEN: ${XHS_COLLECTOR_TOKEN:-}
      TZ: Asia/Shanghai
      GENERIC_TIMEZONE: Asia/Shanghai
      NODE_EXTRA_CA_CERTS: /opt/n8n-certs/market-review-api.pem
    volumes:
      - n8n_data:/home/node/.n8n
      - ./certs/market-review-api.pem:/opt/n8n-certs/market-review-api.pem:ro
      - ./import:/import:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  feishu-adapter:
    build:
      context: .
      dockerfile: Dockerfile.adapter
      args:
        APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
        APP_RELEASE: ${APP_RELEASE:-unknown}
        APP_BUILD_CREATED_AT: ${APP_BUILD_CREATED_AT:-unknown}
    image: ${FEISHU_ADAPTER_IMAGE:-feishu-relay-edge-adapter:local}
    container_name: feishu-relay-edge-adapter
    network_mode: host
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    environment:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: ${RELAY_PGDATABASE}
      PGUSER: ${RELAY_PGUSER}
      PGPASSWORD: ${RELAY_PGPASSWORD}
      INGESTION_STORAGE_DIR: /var/lib/adapter-ingestion
      FEISHU_APP_ID: ${FEISHU_APP_ID}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET}
      FEISHU_LONG_CONNECTION_ENABLED: ${FEISHU_LONG_CONNECTION_ENABLED:-false}
      N8N_WEBHOOK_URL: http://127.0.0.1:5678/webhook/feishu-market-text
      N8N_TEXT_WEBHOOK_URL: http://127.0.0.1:5678/webhook/feishu-market-text
      N8N_MEDIA_WEBHOOK_URL: http://127.0.0.1:5678/webhook/feishu-market-media
      N8N_MEDIA_PART_WEBHOOK_URL: http://127.0.0.1:5678/webhook/feishu-media-part
      N8N_MEDIA_FINALIZE_WEBHOOK_URL: http://127.0.0.1:5678/webhook/feishu-media-finalize
      N8N_MEDIA_STATE_WEBHOOK_URL: http://127.0.0.1:5678/webhook/feishu-media-state
      # Paper-KB commands are received through the private LarkAgentX
      # WebSocket and forwarded to these n8n workflows. Keep this contract in
      # the edge compose file as well as the workstation compose file.
      PAPER_KB_FEISHU_CHAT_ID: ${PAPER_KB_FEISHU_CHAT_ID:-}
      PAPER_KB_INGEST_WEBHOOK: ${PAPER_KB_INGEST_WEBHOOK:-http://127.0.0.1:5678/webhook/paper-ingest}
      PAPER_KB_SEARCH_WEBHOOK: ${PAPER_KB_SEARCH_WEBHOOK:-http://127.0.0.1:5678/webhook/paper-search}
      PAPER_KB_FEEDBACK_WEBHOOK: ${PAPER_KB_FEEDBACK_WEBHOOK:-http://127.0.0.1:5678/webhook/paper-feedback}
      XHS_COMMAND_WEBHOOK: ${XHS_COMMAND_WEBHOOK:-http://127.0.0.1:5678/webhook/xhs-command}
      XHS_COMMAND_CHAT_IDS: ${XHS_COMMAND_CHAT_IDS:-}
      DASHBOARD_HOST: 127.0.0.1
      DASHBOARD_PORT: 18300
      UPLOAD_PART_BYTES: ${UPLOAD_PART_BYTES:-8388608}
      FEISHU_DEDUPE_TTL_MS: ${FEISHU_DEDUPE_TTL_MS:-600000}
      INGESTION_RECONCILE_SECONDS: ${INGESTION_RECONCILE_SECONDS:-300}
      INGESTION_LEDGER_RETENTION_DAYS: ${INGESTION_LEDGER_RETENTION_DAYS:-90}
      INGESTION_MAX_FILE_BYTES: ${INGESTION_MAX_FILE_BYTES:-524288000}
      QUANT_SERVICE_URL: ${QUANT_SERVICE_URL:-http://127.0.0.1:15682}
      QUANT_WRITE_API_KEY: ${QUANT_WRITE_API_KEY}
      QUANT_ALERT_WEBHOOK_TOKEN: ${QUANT_ALERT_WEBHOOK_TOKEN:-}
      FEISHU_ALERT_RECEIVE_ID: ${FEISHU_ALERT_RECEIVE_ID:-}
      FEISHU_ALERT_RECEIVE_ID_TYPE: ${FEISHU_ALERT_RECEIVE_ID_TYPE:-chat_id}
      FEISHU_GROUP_RELAY_ENABLED: ${FEISHU_GROUP_RELAY_ENABLED:-false}
      FEISHU_RELAY_WRITER_ID: ${FEISHU_RELAY_WRITER_ID:-relay-edge-47}
      FEISHU_GROUP_RELAY_INTERVAL_SECONDS: ${FEISHU_GROUP_RELAY_INTERVAL_SECONDS:-10}
      FEISHU_GROUP_RELAY_ACTION_CARDS_ENABLED: ${FEISHU_GROUP_RELAY_ACTION_CARDS_ENABLED:-false}
      FEISHU_GROUP_RELAY_HISTORY_LOOKBACK_SECONDS: ${FEISHU_GROUP_RELAY_HISTORY_LOOKBACK_SECONDS:-300}
      FEISHU_GROUP_RELAY_BOOTSTRAP_MODE: ${FEISHU_GROUP_RELAY_BOOTSTRAP_MODE:-skip_existing}
      FEISHU_GROUP_RELAY_RECONCILE_SECONDS: ${FEISHU_GROUP_RELAY_RECONCILE_SECONDS:-21600}
      FEISHU_GROUP_RELAY_RECONCILE_LOOKBACK_SECONDS: ${FEISHU_GROUP_RELAY_RECONCILE_LOOKBACK_SECONDS:-86400}
      FEISHU_GROUP_RELAY_TARGET_CHAT_ID: ${FEISHU_GROUP_RELAY_TARGET_CHAT_ID:-oc_523b7e9e29854acba64272a948cb8eda}
      FEISHU_GROUP_RELAY_ANQIANG_CHAT_ID: ${FEISHU_GROUP_RELAY_ANQIANG_CHAT_ID:-oc_1de6464db12c43bf60985f7131e6334a}
      FEISHU_GROUP_RELAY_ANQIANG_CHAT_NAME: ${FEISHU_GROUP_RELAY_ANQIANG_CHAT_NAME:-马安强 (1)}
      FEISHU_GROUP_RELAY_LIWEI_CHAT_ID: ${FEISHU_GROUP_RELAY_LIWEI_CHAT_ID:-oc_4ed9fdb72a152bc921b2d34bd4a1df14}
      FEISHU_GROUP_RELAY_LIWEI_CHAT_NAME: ${FEISHU_GROUP_RELAY_LIWEI_CHAT_NAME:-消息更新群}
      FEISHU_GROUP_RELAY_LIWEI_TARGET_CHAT_IDS: ${FEISHU_GROUP_RELAY_LIWEI_TARGET_CHAT_IDS:-}
      FEISHU_GROUP_RELAY_QUANNENG_CHAT_ID: ${FEISHU_GROUP_RELAY_QUANNENG_CHAT_ID:-oc_d6a89890c3a62517116a2c63f015e0a0}
      FEISHU_GROUP_RELAY_QUANNENG_CHAT_NAME: ${FEISHU_GROUP_RELAY_QUANNENG_CHAT_NAME:-新野人哥会员群【禁言】}
      FEISHU_GROUP_RELAY_XIAOJIE_CHAT_ID: ${FEISHU_GROUP_RELAY_XIAOJIE_CHAT_ID:-}
      FEISHU_GROUP_RELAY_XIAOJIE_CHAT_NAME: ${FEISHU_GROUP_RELAY_XIAOJIE_CHAT_NAME:-小杰夜报～}
      FEISHU_GROUP_RELAY_WEBHOOKS: ${FEISHU_GROUP_RELAY_WEBHOOKS:-}
      FEISHU_GROUP_RELAY_WEBHOOK_KEYWORDS: ${FEISHU_GROUP_RELAY_WEBHOOK_KEYWORDS:-}
      WECHAT_GROUP_RELAY_ENABLED: ${WECHAT_GROUP_RELAY_ENABLED:-false}
      WECHAT_GROUP_RELAY_SOURCE_KEY: ${WECHAT_GROUP_RELAY_SOURCE_KEY:-wechat_xiaolan}
      WECHAT_GROUP_RELAY_SOURCE_CHAT_ID: ${WECHAT_GROUP_RELAY_SOURCE_CHAT_ID:-50136408612@chatroom}
      WECHAT_GROUP_RELAY_ROUTE_TAG: ${WECHAT_GROUP_RELAY_ROUTE_TAG:-xiaolan}
      WECHAT_GROUP_RELAY_TARGET_CHAT_ID: ${WECHAT_GROUP_RELAY_TARGET_CHAT_ID:-}
      WECHAT_GROUP_RELAY_ENDPOINT_TOKEN: ${WECHAT_GROUP_RELAY_ENDPOINT_TOKEN:-}
      WECHAT_GROUP_RELAY_MAX_TEXT_LENGTH: ${WECHAT_GROUP_RELAY_MAX_TEXT_LENGTH:-3500}
      FEISHU_SUMMARY_LISTENER_ENABLED: ${FEISHU_SUMMARY_LISTENER_ENABLED:-false}
      FEISHU_SUMMARY_LISTENER_INTERVAL_SECONDS: ${FEISHU_SUMMARY_LISTENER_INTERVAL_SECONDS:-10}
      FEISHU_SUMMARY_LISTENER_HISTORY_LOOKBACK_SECONDS: ${FEISHU_SUMMARY_LISTENER_HISTORY_LOOKBACK_SECONDS:-3600}
      FEISHU_SUMMARY_LISTENER_BOOTSTRAP_MODE: ${FEISHU_SUMMARY_LISTENER_BOOTSTRAP_MODE:-forward_existing}
      FEISHU_USER_OAUTH_REDIRECT_URI: ${FEISHU_USER_OAUTH_REDIRECT_URI:-http://localhost:8080/callback}
      LARKX_BRIDGE_TOKEN: ${LARKX_BRIDGE_TOKEN:-}
      LARKX_BRIDGE_RESOURCE_URL: ${LARKX_BRIDGE_RESOURCE_URL:-http://127.0.0.1:8090/resource}
      LARKX_GROUP_RELAY_ENABLED: ${LARKX_GROUP_RELAY_ENABLED:-false}
      LARKX_GROUP_RELAY_ROUTES: ${LARKX_GROUP_RELAY_ROUTES:-}
      LARKX_XHS_COMMANDS_ENABLED: ${LARKX_XHS_COMMANDS_ENABLED:-true}
      LARKX_DYNAMIC_ROUTE_DISCOVERY: ${LARKX_DYNAMIC_ROUTE_DISCOVERY:-false}
      LARKX_CARD_BACKFILL_ENABLED: ${LARKX_CARD_BACKFILL_ENABLED:-false}
      LARKX_CARD_BACKFILL_TAGS: ${LARKX_CARD_BACKFILL_TAGS:-}
      ITOUGU_STATUS_FILE: ${ITOUGU_STATUS_FILE:-/var/lib/itougu-neican/status.json}
      ITOUGU_CONTROL_URL: ${ITOUGU_CONTROL_URL:-http://127.0.0.1:18084}
      FEISHU_WORKBENCH_PUBLIC_BASE_URL: ${FEISHU_WORKBENCH_PUBLIC_BASE_URL:-}
      FEISHU_WORKBENCH_DRIVE_FOLDER_TOKEN: ${FEISHU_WORKBENCH_DRIVE_FOLDER_TOKEN:-}
      FEISHU_WORKBENCH_DRIVE_MAX_FILE_BYTES: ${FEISHU_WORKBENCH_DRIVE_MAX_FILE_BYTES:-524288000}
      BAIDU_PAN_ENABLED: ${BAIDU_PAN_ENABLED:-false}
      BAIDU_PAN_APP_KEY: ${BAIDU_PAN_APP_KEY:-}
      BAIDU_PAN_SECRET_KEY: ${BAIDU_PAN_SECRET_KEY:-}
      BAIDU_PAN_REDIRECT_URI: ${BAIDU_PAN_REDIRECT_URI:-oob}
      BAIDU_PAN_ROOT_PATH: ${BAIDU_PAN_ROOT_PATH:-/apps/股票paper存储/feishu-relay}
      BAIDU_PAN_SPOOL_DIR: ${BAIDU_PAN_SPOOL_DIR:-/var/lib/adapter-ingestion/baidu-pan-spool}
      BAIDU_PAN_MAX_UPLOAD_BYTES: ${BAIDU_PAN_MAX_UPLOAD_BYTES:-524288000}
      BAIDU_PAN_SLICE_BYTES: ${BAIDU_PAN_SLICE_BYTES:-4194304}
      BAIDU_PAN_ARCHIVE_PROVIDER: ${BAIDU_PAN_ARCHIVE_PROVIDER:-auto}
      BAIDU_PAN_MARKET_ARCHIVE_ENABLED: ${BAIDU_PAN_MARKET_ARCHIVE_ENABLED:-false}
      BAIDU_PAN_MARKET_ARCHIVE_INTERVAL_SECONDS: ${BAIDU_PAN_MARKET_ARCHIVE_INTERVAL_SECONDS:-30}
      BAIDU_PAN_MARKET_ARCHIVE_ROOT_PATH: ${BAIDU_PAN_MARKET_ARCHIVE_ROOT_PATH:-/apps/股票paper存储/market-realtime}
      # Raw overflow is a separate, bounded lane. Keep it disabled until the
      # non-trading-hours ACK/restore drill is complete and edge storage is
      # below its stop watermark.
      BAIDU_PAN_RAW_OVERFLOW_ENABLED: ${BAIDU_PAN_RAW_OVERFLOW_ENABLED:-false}
      BAIDU_PAN_RAW_OVERFLOW_CAPABILITIES: ${BAIDU_PAN_RAW_OVERFLOW_CAPABILITIES:-a_share_prices_snapshot,realtime_quote,order_book_quote,rt_k,rt_min,rt_min_daily}
      BAIDU_PAN_RAW_OVERFLOW_BATCH_ROWS: ${BAIDU_PAN_RAW_OVERFLOW_BATCH_ROWS:-100}
      BAIDU_PAN_RAW_OVERFLOW_BATCHES_PER_DRAIN: ${BAIDU_PAN_RAW_OVERFLOW_BATCHES_PER_DRAIN:-4}
      BAIDU_PAN_RAW_OVERFLOW_ROOT_PATH: ${BAIDU_PAN_RAW_OVERFLOW_ROOT_PATH:-/apps/股票paper存储/quant-lake/v1/raw-overflow}
      FEISHU_WORKBENCH_WIKI_SPACE_ID: ${FEISHU_WORKBENCH_WIKI_SPACE_ID:-}
      FEISHU_WORKBENCH_WIKI_PARENT_NODE_TOKEN: ${FEISHU_WORKBENCH_WIKI_PARENT_NODE_TOKEN:-}
      FEISHU_WORKBENCH_TASKLIST_GUID: ${FEISHU_WORKBENCH_TASKLIST_GUID:-}
      # The adapter source overlay is mounted from the edge host and selected
      # by the entry command below. The same release also carries the
      # LarkAgentX bridge source for its systemd service. Keep this disabled
      # for immutable image releases; the hotfix script enables it only after
      # staging and checks.
      #
      # QUANT_FRONTEND_DIST 指向 /app/hotfix/quant-console/current，而不是中继
      # 发布目录里的 quant-frontend-dist：quant 控制台的源码归 quant-research
      # 组件，已经拆成独立发布单元（scripts/edge/deploy-quant-console-edge.sh），
      # 有自己的 releases/ 和 current/。``./hotfix`` 整体就是挂载点，所以这里
      # 不需要新增卷。该目录不存在时适配器会退回镜像内的副本（index.mjs 里的
      # existsSync 兜底），所以首次切换要先发控制台、再发中继。
      FEISHU_ADAPTER_HOTFIX_ENABLED: ${FEISHU_ADAPTER_HOTFIX_ENABLED:-false}
      APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
      APP_RELEASE: ${APP_RELEASE:-unknown}
      APP_BUILD_CREATED_AT: ${APP_BUILD_CREATED_AT:-unknown}
      TZ: Asia/Shanghai
    command:
      - sh
      - -c
      - >-
        if [ "$$FEISHU_ADAPTER_HOTFIX_ENABLED" = "true" ] && [ -f
        /app/hotfix/current/adapter/index.mjs ]; then export
        FRONTEND_DIST=/app/hotfix/current/frontend-dist; export
        QUANT_FRONTEND_DIST=/app/hotfix/quant-console/current; export
        SOURCE_REGISTRY_FILE=/app/hotfix/current/source-registry.json; export
        FEISHU_ADAPTER_SOURCE_MODE=source-overlay; exec node
        /app/hotfix/current/adapter/index.mjs; fi; export
        FEISHU_ADAPTER_SOURCE_MODE=image; exec node /app/index.mjs
    volumes:
      - ./adapter-ingestion:/var/lib/adapter-ingestion
      - ${FEISHU_ADAPTER_HOTFIX_DIR:-./hotfix}:/app/hotfix:ro
      - ${ITOUGU_STATUS_DIR:-/var/lib/itougu-neican}:/var/lib/itougu-neican:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:18300/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  xhs-collector:
    build:
      context: .
      dockerfile: xhs-intel/Dockerfile
    image: feishu-relay-edge-xhs:local
    container_name: feishu-relay-edge-xhs
    network_mode: host
    restart: unless-stopped
    environment:
      XHS_COLLECTOR_HOST: 127.0.0.1
      XHS_COLLECTOR_PORT: 18790
      XHS_COLLECTOR_TOKEN: ${XHS_COLLECTOR_TOKEN:-}
      XHS_SOURCE_ROOT: /opt/xhs
      XHS_COOKIE_FILE: /run/secrets/xhs_cookie
      XHS_STATE_DIR: /var/lib/xhs-collector
      XHS_KEYWORDS: ${XHS_KEYWORDS:-AI基础设施,AI加速,系统软件,分布式训练,算力网络,推理优化}
      XHS_FETCH_LIMIT: ${XHS_FETCH_LIMIT:-5}
      XHS_SOURCE_GIT_SHA: ${XHS_SOURCE_GIT_SHA:-}
      XHS_SOURCE_TREE_SHA256: ${XHS_SOURCE_TREE_SHA256:-}
      XHS_INTEL_TREE_SHA256: ${XHS_INTEL_TREE_SHA256:-}
      XHS_WORKFLOW_SHA256: ${XHS_WORKFLOW_SHA256:-}
      XHS_FEISHU_WEBHOOK_URL: ${XHS_FEISHU_WEBHOOK_URL:-}
      # 与适配器、quant-service 同一套源码 overlay 机制：改 xhs-intel 的 Python
      # 源码不该每次重建镜像。xhs-intel/scripts/hotfix-xhs-intel-edge.sh 在预检
      # 通过后才把它置为 true。依赖（requirements.txt）、Dockerfile、基础镜像或
      # 外部 Spider_XHS 变化仍然必须走镜像发布 deploy-xhs-intel-edge.sh。
      XHS_HOTFIX_ENABLED: ${XHS_HOTFIX_ENABLED:-false}
      TZ: Asia/Shanghai
    # overlay 启用且源码就位时跑 overlay，否则跑镜像里烤进去的那份 —— 和适配器
    # 的 command 同形。PYTHONPATH 把 overlay 目录放在 /opt/xhs 之前，这样
    # collector/store/operations/config 这些同级模块都从 overlay 解析。
    command:
      - sh
      - -c
      - >-
        if [ "$$XHS_HOTFIX_ENABLED" = "true" ] && [ -f
        /app/hotfix/current/edge_api.py ]; then export
        PYTHONPATH=/app/hotfix/current:/opt/xhs; export
        XHS_RUNTIME_SOURCE=source-overlay; exec python
        /app/hotfix/current/edge_api.py; fi; export PYTHONPATH=/opt/xhs; export
        XHS_RUNTIME_SOURCE=image; exec python /app/edge_api.py
    volumes:
      - ./xhs-state:/var/lib/xhs-collector
      - ${XHS_COOKIE_FILE:-/etc/feishu-relay-edge/xhs-cookie}:/run/secrets/xhs_cookie:ro
      - ${XHS_HOTFIX_DIR:-./hotfix-xhs}:/app/hotfix:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:18790/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  n8n-runners:
    image: n8nio/runners:2.33.7
    container_name: feishu-relay-edge-n8n-runners
    network_mode: host
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_started
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://127.0.0.1:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?Set N8N_RUNNERS_AUTH_TOKEN in secrets.env}
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: "900"
      N8N_RUNNERS_LAUNCHER_LOG_LEVEL: info
      TZ: Asia/Shanghai

volumes:
  n8n_data:
