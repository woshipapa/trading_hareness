services:
  quant-research:
    # This override is intentionally inert unless the operator sets
    # PEER_BACKGROUND_TASKS_ENABLED=true and PEER_RUNTIME_PROFILE=intraday_edge.
    # It keeps the existing peer compose file usable for research/shadow runs.
    env_file:
      - path: ${PEER_INTRADAY_SECRETS_FILE:-./intraday-secrets.env}
        required: false
    environment:
      QUANT_APPLICATION_NAME: peer-quant-research
      PEER_OWNER_CONTRACT_MODE: ${PEER_OWNER_CONTRACT_MODE:-report_only}
      PEER_OWNER_CONTRACT_RECEIPT_PATH: /var/lib/quant/owner-peer-contract.json
      QUANT_BACKGROUND_TASKS_ENABLED: ${PEER_BACKGROUND_TASKS_ENABLED:-false}
      QUANT_RUNTIME_PROFILE: ${PEER_RUNTIME_PROFILE:-research}
      QUANT_SKIP_MIGRATIONS: "true"
      PEER_REQUIRE_OWNER_SEMANTICS: "true"
      QUANT_LEGACY_SCHEMA_BOOTSTRAP: "false"
      # Longhu credentials remain on the owner API.  The writer consumes only
      # the normalized gateway through db-tunnel:5681.
      QUANT_LONGHU_DIRECT_ENABLED: "false"
      QUANT_SHARED_READ_API_BASE_URL: http://db-tunnel:5681
      # Fuyao/同花顺 calls are research-only; pass the operator-managed
      # credential explicitly into the API process.
      FUYAO_API_KEY: ${FUYAO_API_KEY:-}
      # Tushare-compatible licensed routes. DataHub is the bounded REST
      # fallback; ProMax is the independent GET gateway.
      TUSHARE_BACKUP_API_KEY: ${TUSHARE_BACKUP_API_KEY:-}
      TUSHARE_BACKUP_API_URL: ${TUSHARE_BACKUP_API_URL:-}
      TUSHARE_SUPER_GET_MODE: ${TUSHARE_SUPER_GET_MODE:-legacy}
      TUSHARE_SUPER_GET_API_KEY: ${TUSHARE_SUPER_GET_API_KEY:-}
      TUSHARE_SUPER_GET_API_URL: ${TUSHARE_SUPER_GET_API_URL:-}
      TUSHARE_SUPER_GET_FALLBACK_API_KEY: ${TUSHARE_SUPER_GET_FALLBACK_API_KEY:-}
      TUSHARE_SUPER_GET_FALLBACK_API_URL: ${TUSHARE_SUPER_GET_FALLBACK_API_URL:-}
      TUSHARE_SUPER_GET_FALLBACK_PROXY_URL: ${TUSHARE_SUPER_GET_FALLBACK_PROXY_URL:-}
      TUSHARE_SUPER_GET_REQUESTS_PER_MINUTE: ${TUSHARE_SUPER_GET_REQUESTS_PER_MINUTE:-60}
      TUSHARE_SUPER_GET_MIN_INTERVAL_SECONDS: ${TUSHARE_SUPER_GET_MIN_INTERVAL_SECONDS:-1}
      # The owner gateway accepts up to 300 Longhu quote symbols per logical
      # request. Keep the env-file default from silently reducing this to 24.
      QUANT_LONGHU_INTRADAY_MAX_SYMBOLS: ${PEER_LONGHU_INTRADAY_MAX_SYMBOLS:-300}
      # Dashboard/read-model polling and intraday evidence loops share the
      # bounded synchronous repository bridge. Keep it below the database
      # connection budget, but leave enough slots for the owner watcher pool.
      QUANT_DB_BLOCKING_MAX_WORKERS: ${PEER_DB_BLOCKING_MAX_WORKERS:-8}
      QUANT_DB_BLOCKING_MAX_QUEUE: ${PEER_DB_BLOCKING_MAX_QUEUE:-16}
      # Feishu delivery is opt-in.  The next-session cutover may enable the
      # direct path while edge retains group listening/forwarding; a relay
      # tunnel can be enabled later without changing the strategy runtime.
      QUANT_FEISHU_DIRECT_ENABLED: ${PEER_FEISHU_DIRECT_ENABLED:-false}
      INTRADAY_SCAN_INTERVAL_SECONDS: ${PEER_INTRADAY_SCAN_INTERVAL_SECONDS:-30}
      # Keep the full explicit pool admitted up to 100 symbols. Depth and
      # minute context remain bounded priority subsets, not full-pool tapes.
      # Admission fails closed above 100; per-feature budgets remain below.
      INTRADAY_WATCHLIST_MAX_SYMBOLS: ${PEER_WATCHLIST_MAX_SYMBOLS:-100}
      INTRADAY_SUPER_GET_FAST_INTERVAL_SECONDS: ${PEER_SUPER_GET_FAST_INTERVAL_SECONDS:-2}
      INTRADAY_SUPER_GET_FAST_MAX_IN_FLIGHT: ${PEER_SUPER_GET_FAST_MAX_IN_FLIGHT:-6}
      INTRADAY_SUPER_GET_FAST_MAX_SYMBOLS: ${PEER_SUPER_GET_FAST_MAX_SYMBOLS:-36}
      INTRADAY_ORDER_BOOK_ENABLED: ${PEER_ORDER_BOOK_ENABLED:-true}
      INTRADAY_ORDER_BOOK_INTERVAL_SECONDS: ${PEER_ORDER_BOOK_INTERVAL_SECONDS:-5}
      INTRADAY_ORDER_BOOK_MAX_SYMBOLS: ${PEER_ORDER_BOOK_MAX_SYMBOLS:-36}
      INTRADAY_MINUTE_PROFILE_CAPTURE_ENABLED: ${PEER_MINUTE_PROFILE_CAPTURE_ENABLED:-true}
      INTRADAY_MINUTE_PROFILE_MAX_SYMBOLS: ${PEER_MINUTE_PROFILE_MAX_SYMBOLS:-36}
      INTRADAY_BOARD_CURVE_ENABLED: ${PEER_BOARD_CURVE_ENABLED:-true}
      # Keep the low-memory target bounded; raw evidence remains in owner PG.
      QUANT_RUNTIME_MAX_MEMORY_RATIO: ${PEER_RUNTIME_MAX_MEMORY_RATIO:-0.80}
      QUANT_RUNTIME_MIN_FREE_BYTES: ${PEER_RUNTIME_MIN_FREE_BYTES:-2147483648}
      QUANT_RUNTIME_WARNING_FREE_BYTES: ${PEER_RUNTIME_WARNING_FREE_BYTES:-4294967296}
      QUANT_RAW_OVERFLOW_ARCHIVE_ENABLED: "false"

  # Research/post-close worker.  It shares the owner database but has its own
  # runtime profile and durable leases, so it cannot acquire intraday_edge
  # collection tasks.  Keeping this as a second container avoids changing the
  # single-writer realtime process into a broad ``full`` profile.
  quant-research-scheduler:
    # Build the scheduler from the same immutable source/image as the main
    # peer service.  A scheduler-only image reference would let a release
    # switch the source symlink while post-close jobs kept running old factor
    # and instrument code.
    build:
      context: ../..
      dockerfile: quant-service/Dockerfile.peer
      additional_contexts:
        wheelhouse: ${PEER_WHEELHOUSE_PATH:?Set PEER_WHEELHOUSE_PATH}
      args:
        APP_GIT_SHA: ${PEER_APP_GIT_SHA:-unknown}
        APP_RELEASE: ${PEER_APP_RELEASE:-unknown}
        APP_BUILD_CREATED_AT: ${PEER_APP_BUILD_CREATED_AT:-unknown}
    image: ${PEER_QUANT_IMAGE:-trading-hareness-peer-quant-research:latest}
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "5"}
    depends_on:
      db-tunnel:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PEER_RESEARCH_QUANT_PORT:-15683}:8000"
    env_file:
      - path: ${PEER_INTRADAY_SECRETS_FILE:-./intraday-secrets.env}
        required: false
    environment:
      # Batch/backfill/COPY work uses the owner's independent 15433 reverse,
      # exposed by the normal peer db-tunnel as 5433. Intraday remains on the
      # separate quant-research service at db-tunnel:5432.
      PGHOST: ${PEER_RESEARCH_DB_HOST:-db-tunnel}
      # All post-close/backfill/COPY work uses the independent bulk tunnel;
      # intraday quant-research remains on db-tunnel:5432.
      PGPORT: ${PEER_RESEARCH_DB_PORT:-5433}
      PGDATABASE: ${PEER_QUANT_DATABASE:-trading_hareness}
      PGUSER: ${PEER_DB_USER:-stock_peer}
      PGPASSWORD: ${PEER_DB_PASSWORD:?Set PEER_DB_PASSWORD}
      # Keep the operator's intent visible inside the scheduler.  ``auto``
      # still infers the guard from db-tunnel:5433; an explicit true is
      # useful in a preflight; migration execution remains disabled.
      PEER_REQUIRE_OWNER_CUTOVER: ${PEER_REQUIRE_OWNER_CUTOVER:-auto}
      PEER_REQUIRE_OWNER_SEMANTICS: "true"
      QUANT_DATA_DIR: /var/lib/quant-research
      QUANT_LEGACY_SCHEMA_BOOTSTRAP: "false"
      QUANT_SKIP_MIGRATIONS: "true"
      QUANT_BACKGROUND_TASKS_ENABLED: ${PEER_RESEARCH_BACKGROUND_TASKS_ENABLED:-true}
      QUANT_RUNTIME_PROFILE: research
      QUANT_WRITE_API_KEY: ${PEER_QUANT_WRITE_API_KEY:?Set PEER_QUANT_WRITE_API_KEY}
      QUANT_SHARED_READ_API_KEY: ${QUANT_SHARED_READ_API_KEY:?Set QUANT_SHARED_READ_API_KEY}
      QUANT_SHARED_READ_API_BASE_URL: http://db-tunnel:5681
      # Keep the scheduler's provider configuration identical to the API lane.
      FUYAO_API_KEY: ${FUYAO_API_KEY:-}
      TUSHARE_BACKUP_API_KEY: ${TUSHARE_BACKUP_API_KEY:-}
      TUSHARE_BACKUP_API_URL: ${TUSHARE_BACKUP_API_URL:-}
      TUSHARE_SUPER_GET_MODE: ${TUSHARE_SUPER_GET_MODE:-legacy}
      TUSHARE_SUPER_GET_API_KEY: ${TUSHARE_SUPER_GET_API_KEY:-}
      TUSHARE_SUPER_GET_API_URL: ${TUSHARE_SUPER_GET_API_URL:-}
      TUSHARE_SUPER_GET_FALLBACK_API_KEY: ${TUSHARE_SUPER_GET_FALLBACK_API_KEY:-}
      TUSHARE_SUPER_GET_FALLBACK_API_URL: ${TUSHARE_SUPER_GET_FALLBACK_API_URL:-}
      TUSHARE_SUPER_GET_FALLBACK_PROXY_URL: ${TUSHARE_SUPER_GET_FALLBACK_PROXY_URL:-}
      TUSHARE_SUPER_GET_REQUESTS_PER_MINUTE: ${TUSHARE_SUPER_GET_REQUESTS_PER_MINUTE:-60}
      TUSHARE_SUPER_GET_MIN_INTERVAL_SECONDS: ${TUSHARE_SUPER_GET_MIN_INTERVAL_SECONDS:-1}
      QUANT_APPLICATION_NAME: peer-quant-research-scheduler
      PEER_OWNER_CONTRACT_MODE: ${PEER_OWNER_CONTRACT_MODE:-report_only}
      PEER_OWNER_CONTRACT_RECEIPT_PATH: /var/lib/quant-research/owner-peer-contract.json
      QUANT_DB_BLOCKING_MAX_WORKERS: ${PEER_RESEARCH_DB_BLOCKING_MAX_WORKERS:-4}
      QUANT_DB_BLOCKING_MAX_QUEUE: ${PEER_RESEARCH_DB_BLOCKING_MAX_QUEUE:-16}
      QUANT_LONGHU_DIRECT_ENABLED: "false"
      QUANT_FEISHU_DIRECT_ENABLED: "false"
      STRATEGY_REVIEW_AUTOMATION_ENABLED: ${PEER_STRATEGY_REVIEW_AUTOMATION_ENABLED:-true}
      POST_CLOSE_STRATEGY_AUTOMATION_ENABLED: ${PEER_POST_CLOSE_STRATEGY_AUTOMATION_ENABLED:-true}
      TEN_DAY_LEADER_ROTATION_AUTOMATION_ENABLED: ${PEER_TEN_DAY_LEADER_ROTATION_AUTOMATION_ENABLED:-true}
      DAILY_SUMMARY_AUTOMATION_ENABLED: ${PEER_DAILY_SUMMARY_AUTOMATION_ENABLED:-true}
      # Member backfills are separate maintenance work, not part of the
      # migrated close-review worker.  They stay opt-in and bounded.
      THS_CONCEPT_MEMBER_BACKFILL_ENABLED: ${PEER_RESEARCH_THS_BACKFILL_ENABLED:-false}
      ALL_BOARD_MEMBER_BACKFILL_ENABLED: ${PEER_RESEARCH_BOARD_BACKFILL_ENABLED:-false}
      QUANT_RUNTIME_MAX_MEMORY_RATIO: ${PEER_RESEARCH_MAX_MEMORY_RATIO:-0.70}
      QUANT_RUNTIME_MIN_FREE_BYTES: ${PEER_RESEARCH_MIN_FREE_BYTES:-2147483648}
      QUANT_RUNTIME_WARNING_FREE_BYTES: ${PEER_RESEARCH_WARNING_FREE_BYTES:-4294967296}
      QUANT_RAW_OVERFLOW_ARCHIVE_ENABLED: "false"
      NO_PROXY: "*"
      TZ: Asia/Shanghai
    volumes:
      - peer_quant_research_data:/var/lib/quant-research
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
