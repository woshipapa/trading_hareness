name: trading-hareness-peer

services:
  db-tunnel:
    build:
      context: ../..
      dockerfile: deploy/shared-peer/Dockerfile.ssh-tunnel
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "5"}
    environment:
      PEER_SSH_HOST: ${PEER_SSH_HOST:?Set PEER_SSH_HOST}
      PEER_SSH_PORT: ${PEER_SSH_PORT:-3535}
      PEER_SSH_USER: ${PEER_SSH_USER:-stockpeer}
      REMOTE_DB_PORT: ${REMOTE_DB_PORT:-15432}
      REMOTE_BATCH_DB_PORT: ${REMOTE_BATCH_DB_PORT:-15433}
      REMOTE_API_PORT: ${REMOTE_API_PORT:-15681}
      # PEER_SSH_HOST may be a routing-internal address (VPN/overlay IP) that
      # moves independently of the owner host's identity. known_hosts is keyed
      # to the stable public alias, so StrictHostKeyChecking against the
      # internal address failed closed the moment a fresh connection (rather
      # than a long-lived cached one) was required. See .env.example.
      PEER_SSH_HOST_KEY_ALIAS: ${PEER_SSH_HOST_KEY_ALIAS:-}
    volumes:
      - ${PEER_SSH_KEY_PATH:?Set PEER_SSH_KEY_PATH}:/run/secrets/peer_ssh_key:ro
      - ${PEER_KNOWN_HOSTS_PATH:?Set PEER_KNOWN_HOSTS_PATH}:/run/secrets/known_hosts:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5432 && nc -z 127.0.0.1 5433 && nc -z 127.0.0.1 5681"]
      interval: 10s
      timeout: 3s
      retries: 12

  # Independent bulk lane. A reconnect or long COPY here must not interrupt
  # the low-latency 5432/session path. The owner publishes 15433 -> 55432.
  db-batch-tunnel:
    build:
      context: ../..
      dockerfile: deploy/shared-peer/Dockerfile.ssh-tunnel
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "5"}
    environment:
      PEER_SSH_HOST: ${PEER_SSH_HOST:?Set PEER_SSH_HOST}
      PEER_SSH_PORT: ${PEER_SSH_PORT:-3535}
      PEER_SSH_USER: ${PEER_SSH_USER:-stockpeer}
      REMOTE_DB_PORT: ${REMOTE_BATCH_DB_PORT:-15433}
      LOCAL_DB_BIND_PORT: 5433
      ENABLE_BATCH_FORWARD: "false"
      ENABLE_API_FORWARD: "false"
      PEER_SSH_HOST_KEY_ALIAS: ${PEER_SSH_HOST_KEY_ALIAS:-}
    volumes:
      - ${PEER_SSH_KEY_PATH:?Set PEER_SSH_KEY_PATH}:/run/secrets/peer_ssh_key:ro
      - ${PEER_KNOWN_HOSTS_PATH:?Set PEER_KNOWN_HOSTS_PATH}:/run/secrets/known_hosts:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5433"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s

  quant-research:
    build:
      context: ../..
      dockerfile: quant-service/Dockerfile.peer
      additional_contexts:
        wheelhouse: ${PEER_WHEELHOUSE_PATH:?Set PEER_WHEELHOUSE_PATH}
      args:
        APP_GIT_SHA: ${PEER_APP_GIT_SHA:-unknown}
        APP_RELEASE: ${PEER_APP_RELEASE:-unknown}
        APP_BUILD_CREATED_AT: ${PEER_APP_BUILD_CREATED_AT:-unknown}
    image: ${PEER_QUANT_IMAGE:-trading-hareness-peer-quant-research:latest}
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "5"}
    depends_on:
      db-tunnel:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PEER_QUANT_PORT:-15682}:8000"
    environment:
      PGHOST: db-tunnel
      PGPORT: 5432
      PGDATABASE: ${PEER_QUANT_DATABASE:-trading_hareness}
      PGUSER: ${PEER_DB_USER:-stock_peer}
      PGPASSWORD: ${PEER_DB_PASSWORD:?Set PEER_DB_PASSWORD}
      QUANT_DATA_DIR: /var/lib/quant
      QUANT_ASYNC_READ_POOL_MAX_SIZE: ${PEER_RESEARCH_ASYNC_READ_POOL_MAX_SIZE:-16}
      QUANT_LEGACY_SCHEMA_BOOTSTRAP: "false"
      # Schema migrations belong to the owner release pipeline and must never
      # run from the peer container. Existing stock_peer write ACLs are
      # monitored by declaration/error reconciliation, not changed here.
      QUANT_SKIP_MIGRATIONS: "true"
      # New research SQL reports the owner's live machine-readable contract;
      # it does not invent adjustment_state/factor_semantics columns.
      PEER_REQUIRE_OWNER_SEMANTICS: ${PEER_REQUIRE_OWNER_SEMANTICS:-true}
      QUANT_BACKGROUND_TASKS_ENABLED: ${PEER_BACKGROUND_TASKS_ENABLED:-false}
      QUANT_RUNTIME_PROFILE: research
      QUANT_WRITE_API_KEY: ${PEER_QUANT_WRITE_API_KEY:?Set PEER_QUANT_WRITE_API_KEY}
      QUANT_SHARED_READ_API_KEY: ${QUANT_SHARED_READ_API_KEY:?Set QUANT_SHARED_READ_API_KEY}
      QUANT_SHARED_READ_API_BASE_URL: http://db-tunnel:5681
      QUANT_APPLICATION_NAME: peer-quant-research
      APP_GIT_SHA: ${PEER_APP_GIT_SHA:-unknown}
      APP_RELEASE: ${PEER_APP_RELEASE:-unknown}
      APP_BUILD_CREATED_AT: ${PEER_APP_BUILD_CREATED_AT:-unknown}
      # Contract rollout is report-only for the first restart. Once the
      # receipt exists, operators may set PEER_OWNER_CONTRACT_MODE=block.
      PEER_OWNER_CONTRACT_MODE: ${PEER_OWNER_CONTRACT_MODE:-report_only}
      PEER_OWNER_CONTRACT_RECEIPT_PATH: /var/lib/quant/owner-peer-contract.json
      # The peer is a gateway consumer; only the licensed owner host may use
      # the direct Longhu adapter.
      QUANT_LONGHU_DIRECT_ENABLED: "false"
      QUANT_HOTFIX_ENABLED: ${QUANT_HOTFIX_ENABLED:-false}
      NO_PROXY: "*"
      TZ: Asia/Shanghai
    volumes:
      - peer_quant_data:/var/lib/quant
      - ${QUANT_HOTFIX_HOST_DIR:-./hotfix/quant-service}:/app/hotfix:ro
    command:
      - sh
      - -c
      - >-
        if [ "$$QUANT_HOTFIX_ENABLED" = "true" ] && [ -f /app/hotfix/current/app/main.py ]; then
        export PYTHONPATH=/app/hotfix/current:/app;
        exec python /app/hotfix/current/entrypoint.py uvicorn app.main:app --app-dir /app/hotfix/current --host 0.0.0.0 --port 8000; fi;
        if [ "$$QUANT_HOTFIX_ENABLED" = "true" ] && [ -f /app/hotfix/current/quant-service/app/main.py ]; then
        export PYTHONPATH=/app/hotfix/current/quant-service:/app;
        exec python /app/hotfix/current/quant-service/entrypoint.py uvicorn app.main:app --app-dir /app/hotfix/current/quant-service --host 0.0.0.0 --port 8000; fi;
        exec python entrypoint.py uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.33.7
    profiles: ["n8n"]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "5"}
    depends_on:
      db-tunnel:
        condition: service_healthy
      quant-research:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PEER_N8N_PORT:-15678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db-tunnel
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${PEER_N8N_DATABASE:-trading_hareness_peer_n8n}
      DB_POSTGRESDB_USER: ${PEER_DB_USER:-stock_peer}
      DB_POSTGRESDB_PASSWORD: ${PEER_DB_PASSWORD:?Set PEER_DB_PASSWORD}
      DB_POSTGRESDB_SCHEMA: public
      N8N_ENCRYPTION_KEY: ${PEER_N8N_ENCRYPTION_KEY:?Set PEER_N8N_ENCRYPTION_KEY}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RUNNERS_MODE: internal
      QUANT_SERVICE_URL: http://quant-research:8000
      QUANT_WRITE_API_KEY: ${PEER_QUANT_WRITE_API_KEY:?Set PEER_QUANT_WRITE_API_KEY}
      GENERIC_TIMEZONE: Asia/Shanghai
      TZ: Asia/Shanghai
    volumes:
      - peer_n8n_data:/home/node/.n8n

volumes:
  peer_quant_data:
  peer_quant_research_data:
  peer_n8n_data:
