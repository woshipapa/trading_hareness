server {
    listen 0.0.0.0:18301;
    server_name _;
    server_tokens off;

    # The listener may bind every interface so it survives a Tailscale address
    # change, but only authenticated tailnet source addresses may use it.
    allow 100.64.0.0/10;
    deny all;

    root /opt/feishu-relay-edge/hotfix/current/frontend-dist;
    index index.html;

    # Large Vite bundles travel through DERP much more reliably when nginx
    # serves them with Content-Length and compression instead of relaying the
    # adapter's chunked response.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location = /health {
        proxy_pass http://127.0.0.1:18300;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
